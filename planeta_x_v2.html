<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLANETA X</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#05030a;--fg:#fff;--pri:#a855f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:'Press Start 2P',monospace;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
#game{position:relative;width:min(100%,calc((100vh - 12px)*16/9));aspect-ratio:16/9;border:3px solid var(--pri);border-radius:10px;overflow:hidden;box-shadow:0 0 40px rgba(168,85,247,.5)}
#game:fullscreen{width:min(100vw,100vh*16/9);border:0;border-radius:0;margin:auto}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:3%;background:rgba(10,5,25,.92);z-index:5;font-size:clamp(7px,1.3vw,12px);line-height:1.7}
.ov.on{display:flex}
h1,h2{margin:0;font-size:clamp(16px,4.6vw,48px)}h2{font-size:clamp(12px,3vw,32px);color:#facc15}
h1{background:linear-gradient(90deg,#22d3ee,#c084fc,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.b{font:inherit;font-size:clamp(8px,1.5vw,15px);padding:.9em 1.4em;background:linear-gradient(90deg,#22c55e,#10b981);color:#04130b;border:0;border-bottom:4px solid #166534;border-radius:10px;cursor:pointer}
.b:active{transform:translateY(2px)}
#fs{position:absolute;top:6px;right:6px;z-index:6;font:inherit;font-size:9px;padding:6px 8px;background:rgba(88,28,135,.8);color:#fff;border:1px solid #c084fc;border-radius:6px;cursor:pointer}
#tc{position:absolute;left:0;right:0;bottom:8px;display:none;justify-content:space-between;padding:0 14px;pointer-events:none;z-index:4}
#tc div{display:flex;gap:10px}
.tb{pointer-events:auto;min-width:clamp(48px,9vw,76px);height:clamp(48px,9vw,76px);background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);border-radius:12px;color:#fff;font:inherit;font-size:14px;touch-action:none}
.tb:active{background:rgba(255,255,255,.4)}
</style></head><body>
<div id="wrap"><div id="game">
<canvas id="c" width="960" height="540"></canvas>
<button id="fs">⛶ PANTALLA COMPLETA</button>
<div id="tc"><div><button class="tb" data-k="l">◀</button><button class="tb" data-k="r">▶</button></div><button class="tb" data-k="j" style="min-width:clamp(80px,14vw,120px)">SALTAR</button></div>
<div class="ov on" id="st"><h1>PLANETA X</h1>
<div>Conquista los 3 biomas. Junta cristales, aplasta alienígenas y esquiva a los voladores.</div>
<button class="b" id="b-st">¡INICIAR AVENTURA!</button>
<div style="color:#94a3b8">Flechas / WASD + Espacio · Mando · Táctil<br>P = pausa · M = música<br><span id="rec"></span></div></div>
<div class="ov" id="lc"><h2 id="lc-t"></h2><div id="lc-s"></div><button class="b" id="b-nx">SIGUIENTE NIVEL ▶</button></div>
<div class="ov" id="go" style="background:rgba(69,10,10,.93)"><h2 style="color:#ef4444">MISIÓN FALLIDA</h2><div id="go-s"></div><button class="b" id="b-rt" style="background:#dc2626;color:#fff;border-color:#7f1d1d">REINTENTAR NIVEL</button></div>
<div class="ov" id="vi" style="background:rgba(2,44,34,.93)"><h2 style="color:#34d399">¡CONQUISTASTE EL PLANETA X!</h2><div id="vi-s"></div><button class="b" id="b-wn">VOLVER A JUGAR</button></div>
<div class="ov" id="ps"><h2>PAUSA</h2><button class="b" id="b-rs">CONTINUAR</button></div>
</div></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),ctx=cv.getContext('2d'),W=960,H=540;
// ---------- Audio ----------
let AC=null,musicOn=true;
function ia(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
const SND={jump:['square',160,450,.15,.1],coin:['sine',900,1400,.18,.15],stomp:['triangle',280,60,.12,.25],hit:['sawtooth',200,50,.25,.22],win:['sine',500,1200,.5,.2]};
function tone(t,f1,f2,d,v){const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}
function snd(k){if(!AC)return;try{tone(...SND[k])}catch(e){}}
const NT=[110,165,196,165,131,196,262,196],TR=[1,1.2,.9];let mi=0;
setInterval(()=>{if(!AC||!musicOn||state!=='PLAY')return;try{const f=NT[mi++%8]*TR[lv];tone('triangle',f,f*.98,.22,.05)}catch(e){}},240);
// ---------- Datos ----------
const BIO=[{n:'Superficie Violeta',top:'#a855f7',body:'#3b0764',b1:'#0d0722',b2:'#4a154b',en:'#22c55e'},
{n:'Cueva de Cobre',top:'#f97316',body:'#7c2d12',b1:'#1a0c02',b2:'#431407',en:'#ef4444'},
{n:'Núcleo Neón',top:'#06b6d4',body:'#155e75',b1:'#02131e',b2:'#083344',en:'#eab308'}];
// g: suelo [x,w] · p: plataformas [x,y,w] · e: caminantes [min,max,ySuperficie,vx] · f: voladores [min,max,yBase,vx] · c: cristales [x,y]
const LV=[
{g:[[0,700],[780,600],[1480,900]],p:[[220,350,140],[420,270,160],[620,360,120],[860,340,120],[1040,260,180],[1280,330,140],[1600,360,140],[1800,270,180]],
e:[[420,550,270,1.5],[790,1050,460,2],[1050,1180,260,1.8],[1500,1800,460,2.2]],f:[],
c:[[260,310],[480,220],[660,310],[900,290],[1110,210],[1860,220]],flag:2250},
{g:[[0,500],[620,450],[1200,400],[1720,800]],p:[[180,360,110],[340,280,120],[520,220,100],[700,330,130],[920,250,140],[1100,340,110],[1320,270,150],[1540,200,120],[1800,340,160]],
e:[[180,270,360,2.2],[630,950,460,2.8],[920,1030,250,2],[1320,1440,270,2.5],[1750,2100,460,3]],f:[[1150,1450,390,2]],
c:[[220,320],[380,240],[550,170],[960,200],[1370,220],[1580,150],[1880,290]],flag:2350},
{g:[[0,400],[520,350],[1000,350],[1500,300],[1950,800]],p:[[150,350,90],[280,260,90],[420,190,120],[600,310,100],[760,230,100],[900,160,120],[1120,280,110],[1300,210,110],[1480,150,140],[1700,290,120],[1860,200,120]],
e:[[280,350,260,2.5],[530,820,460,3.2],[760,840,230,2.2],[1010,1300,460,3.5],[1480,1590,150,2.8],[1980,2400,460,4]],f:[[600,900,390,2.5],[1600,1900,390,3]],
c:[[180,310],[310,220],[460,140],[800,180],[940,110],[1340,160],[1520,100],[1900,150]],flag:2550}];
// ---------- Estado ----------
let state='START',lv=0,score=0,lvScore=0,lives=3,cam=0,t=0,best=0,got=0,jp=0,padOn=false;
let plat=[],en=[],cr=[],parts=[],flag={},safe={x:60,y:350};
try{best=+localStorage.getItem('px_best')||0}catch(e){}
const P={x:60,y:350,w:28,h:38,vx:0,vy:0,gr:0,face:1,anim:0,inv:0,coy:0,buf:0};
const ST=Array.from({length:70},(_,i)=>({x:Math.random()*W,y:Math.random()*H*.85,z:.05+Math.random()*.3,s:1+i%2}));
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function show(id){document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on'));if(id)$(id).classList.add('on')}
function saveBest(){if(score>best){best=score;try{localStorage.setItem('px_best',best)}catch(e){}}$('rec').textContent='RÉCORD: '+best}
$('rec').textContent='RÉCORD: '+best;
function load(i){lv=i;lvScore=score;const L=LV[i];
plat=[...L.g.map(([x,w])=>({x,y:460,w,h:80,s:1})),...L.p.map(([x,y,w])=>({x,y,w,h:24,s:0}))];
en=[...L.e.map(([a,b,y,v])=>({x:a,y:y-24,a,b,v,w:26,h:24,fl:0,alive:1})),...L.f.map(([a,b,y,v])=>({x:a,y,y0:y,a,b,v,w:26,h:24,fl:1,alive:1}))];
cr=L.c.map(([x,y])=>({x,y,got:0}));got=0;flag={x:L.flag,y:340,w:35,h:120};
Object.assign(P,{x:60,y:350,vx:0,vy:0,gr:0,inv:0,coy:0,buf:0});safe={x:60,y:350};cam=0;parts=[]}
function burst(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*6,vy:-Math.random()*5,l:25+Math.random()*15,c})}
// ---------- Entrada (teclado, táctil y mando por separado) ----------
const I={kb:{l:0,r:0,j:0},tc:{l:0,r:0,j:0},gp:{l:0,r:0,j:0}};
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j'};
addEventListener('keydown',e=>{const k=KM[e.code];if(k){I.kb[k]=1;e.preventDefault();ia()}if(e.code==='KeyP'||e.code==='Escape')pause();if(e.code==='KeyM')musicOn=!musicOn});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)I.kb[k]=0});
document.querySelectorAll('.tb').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();ia();I.tc[k]=1});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>I.tc[k]=0))});
if(matchMedia('(pointer:coarse)').matches)$('tc').style.display='flex';
function pad(){const g=(navigator.getGamepads?[...navigator.getGamepads()]:[]).find(x=>x);Object.assign(I.gp,{l:0,r:0,j:0});padOn=!!g;if(!g)return;const a=g.axes[0]||0,b=i=>g.buttons[i]&&g.buttons[i].pressed;
I.gp.l=a<-.3||b(14)?1:0;I.gp.r=a>.3||b(15)?1:0;I.gp.j=b(0)||b(1)||b(2)||b(12)?1:0}
function pause(){if(state==='PLAY'){state='PAUSE';show('ps')}else if(state==='PAUSE'){state='PLAY';show()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='PLAY')pause()});
$('fs').onclick=()=>{const g=$('game');document.fullscreenElement?document.exitFullscreen():g.requestFullscreen().catch(()=>{})};
// ---------- Lógica ----------
function hurt(){if(P.inv>0)return;snd('hit');lives--;burst(P.x+14,P.y+19,'#ef4444',12);if(lives<=0)return over();P.inv=90;P.vy=-7}
function fall(){snd('hit');lives--;if(lives<=0)return over();Object.assign(P,{x:safe.x,y:safe.y,vx:0,vy:0,inv:120})}
function over(){state='OVER';saveBest();$('go-s').innerHTML='PUNTOS: '+score+'<br>NIVEL '+(lv+1)+' de 3';$('b-rt').textContent='REINTENTAR NIVEL '+(lv+1);show('go')}
function win(){snd('win');const all=got===cr.length;if(all)score+=500;saveBest();
if(lv<2){state='LC';$('lc-t').textContent='¡NIVEL '+(lv+1)+' COMPLETADO!';$('lc-s').innerHTML='Cristales: '+got+'/'+cr.length+(all?'<br>¡BONUS +500!':'')+'<br><br>Siguiente: '+BIO[lv+1].n;show('lc')}
else{state='WIN';$('vi-s').innerHTML='PUNTUACIÓN FINAL: '+score+'<br>RÉCORD: '+best;show('vi')}}
function upd(){t++;
const L=I.kb.l||I.tc.l||I.gp.l,R=I.kb.r||I.tc.r||I.gp.r,J=I.kb.j||I.tc.j||I.gp.j;
if(J&&!jp)P.buf=6;jp=J;
if(L&&!R){P.vx=-4.5;P.face=-1}else if(R&&!L){P.vx=4.5;P.face=1}else P.vx*=.72;
P.coy=P.gr?6:Math.max(0,P.coy-1);P.buf=Math.max(0,P.buf-1);
if(P.buf&&P.coy){P.vy=-12.5;P.gr=0;P.coy=0;P.buf=0;snd('jump');burst(P.x+14,P.y+38,'#fff',5)}
P.vy=Math.min(P.vy+.58+(!J&&P.vy<0?.7:0),14);
const oy=P.y;P.x+=P.vx;
for(const p of plat)if(p.s&&hit(P,p)){P.x=P.vx>0?p.x-P.w:p.x+p.w;P.vx=0}
P.x=Math.min(Math.max(0,P.x),flag.x+100);
P.y+=P.vy;const was=P.gr;P.gr=0;
for(const p of plat)if(hit(P,p)){
if(P.vy>=0&&oy+P.h<=p.y+.01){P.y=p.y-P.h;P.vy=0;P.gr=1;if(!was)burst(P.x+14,P.y+38,'#fff',3);if(p.s)safe={x:Math.min(Math.max(P.x-50,p.x),p.x+p.w-P.w),y:p.y-P.h}}
else if(p.s&&P.vy<0){P.y=p.y+p.h;P.vy=0}}
P.anim+=Math.abs(P.vx)>.5?.25:0;if(P.inv>0)P.inv--;
if(P.y>H+80){fall();return}
for(const e of en){if(!e.alive)continue;e.x+=e.v;if(e.x<e.a||e.x+e.w>e.b){e.v*=-1;e.x=Math.min(Math.max(e.x,e.a),e.b-e.w)}
if(e.fl)e.y=e.y0+Math.sin(t/20+e.a)*35;
if(hit(P,e)){if(P.vy>0&&oy+P.h<=e.y+14){e.alive=0;P.vy=-9;score+=250;snd('stomp');burst(e.x+13,e.y+12,BIO[lv].en,14)}else hurt()}}
for(const c of cr)if(!c.got&&hit(P,{x:c.x,y:c.y,w:20,h:24})){c.got=1;got++;score+=150;snd('coin');burst(c.x+10,c.y+12,'#fbbf24',10)}
if(hit(P,flag)){win();return}
cam+=(Math.min(Math.max(0,P.x-300),flag.x+150-W)-cam)*.12;
parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.l--});parts=parts.filter(p=>p.l>0)}
// ---------- Dibujo ----------
function mts(b){[[.12,360,'top',.2,130,1],[.3,445,'body',.8,100,1.7]].forEach(([f,base,col,al,amp,k])=>{ctx.fillStyle=b[col];ctx.globalAlpha=al;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=16){const wx=x+cam*f;ctx.lineTo(x,base-amp*(.3+.7*Math.abs(Math.sin(wx*.006*k+f*10)))-16*Math.sin(wx*.021))}ctx.lineTo(W,H);ctx.fill()});ctx.globalAlpha=1}
function render(){const b=BIO[lv];const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,b.b1);g.addColorStop(1,b.b2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#fff';for(const s of ST){ctx.globalAlpha=.3+s.z;ctx.fillRect(((s.x-cam*s.z)%W+W)%W,s.y,s.s,s.s)}
ctx.fillStyle=b.top;ctx.globalAlpha=.25;ctx.beginPath();ctx.arc(700-cam*.08,110,60,0,7);ctx.fill();ctx.globalAlpha=.12;ctx.beginPath();ctx.arc(200-cam*.04,300,90,0,7);ctx.fill();ctx.globalAlpha=1;
mts(b);
for(const p of plat){const x=Math.floor(p.x-cam);if(x+p.w<0||x>W)continue;ctx.fillStyle=b.top;ctx.fillRect(x,p.y,p.w,8);ctx.fillStyle=b.body;ctx.fillRect(x,p.y+8,p.w,p.h-8);ctx.fillStyle='rgba(0,0,0,.25)';for(let i=x+12;i<x+p.w-12;i+=24)ctx.fillRect(i,p.y+16,10,10)}
for(const c of cr){if(c.got)continue;const x=Math.floor(c.x-cam),y=c.y+Math.sin(t/12+c.x)*4;ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.moveTo(x+10,y);ctx.lineTo(x+20,y+12);ctx.lineTo(x+10,y+24);ctx.lineTo(x,y+12);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x+7,y+6,5,5)}
for(const e of en){if(!e.alive)continue;const x=Math.floor(e.x-cam);ctx.fillStyle=b.en;
if(e.fl){const w=Math.sin(t/4)*8;ctx.beginPath();ctx.moveTo(x+13,e.y+10);ctx.lineTo(x-8,e.y+w);ctx.lineTo(x+4,e.y+16);ctx.moveTo(x+13,e.y+10);ctx.lineTo(x+34,e.y+w);ctx.lineTo(x+22,e.y+16);ctx.fill()}
ctx.beginPath();ctx.arc(x+13,e.y+12,12,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+13,e.y+9,5,0,7);ctx.fill();ctx.fillStyle='#000';ctx.fillRect(x+12+(e.v>0?1:-1),e.y+8,3,3)}
const fx=Math.floor(flag.x-cam),w=Math.sin(t/8)*5;ctx.fillStyle='#cbd5e1';ctx.fillRect(fx+6,flag.y,6,flag.h);ctx.fillStyle='#ef4444';ctx.beginPath();ctx.moveTo(fx+12,flag.y);ctx.lineTo(fx+42,flag.y+20+w);ctx.lineTo(fx+12,flag.y+40);ctx.fill();
if(P.inv%6<3){ctx.save();ctx.translate(Math.floor(P.x-cam),Math.floor(P.y));if(P.face<0){ctx.scale(-1,1);ctx.translate(-P.w,0)}
ctx.fillStyle='#64748b';ctx.fillRect(-2,10,6,20);ctx.fillStyle='#38bdf8';ctx.fillRect(4,12,20,18);ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.arc(14,10,11,0,7);ctx.fill();ctx.fillStyle='#fbbf24';ctx.fillRect(14,5,9,8);ctx.fillStyle='#0284c7';const o=Math.sin(P.anim)*5;
if(!P.gr){ctx.fillRect(5,30,7,7);ctx.fillRect(16,28,7,7)}else{ctx.fillRect(5,30,7,7+o);ctx.fillRect(16,30,7,7-o)}ctx.restore()}
for(const p of parts){ctx.globalAlpha=Math.min(1,p.l/15);ctx.fillStyle=p.c;ctx.fillRect(p.x-cam,p.y,4,4)}ctx.globalAlpha=1;
ctx.font='20px "Press Start 2P",monospace';ctx.textAlign='center';ctx.fillStyle='#a855f7';ctx.fillText('PLANETA X',W/2+2,38);ctx.fillStyle='#06b6d4';ctx.fillText('PLANETA X',W/2-2,38);ctx.fillStyle='#fff';ctx.fillText('PLANETA X',W/2,36);
ctx.font='12px "Press Start 2P",monospace';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText('SCORE: '+score,20,30);ctx.fillStyle='#facc15';ctx.fillText('NIVEL '+(lv+1)+'/3 - '+b.n,20,52);
ctx.fillStyle='#fff';ctx.fillText('VIDAS:',20,74);ctx.fillStyle='#38bdf8';for(let i=0;i<lives;i++){ctx.beginPath();ctx.arc(115+i*20,69,7,0,7);ctx.fill()}
ctx.textAlign='right';ctx.font='10px "Press Start 2P",monospace';ctx.fillStyle='#fbbf24';ctx.fillText('CRISTALES '+got+'/'+cr.length,W-20,58);ctx.fillStyle=padOn?'#4ade80':'#94a3b8';ctx.fillText(padOn?'MANDO ACTIVO':'P = PAUSA',W-20,78)}
// ---------- Bucle (paso fijo: misma velocidad en cualquier monitor) ----------
let last=0,acc=0;
function loop(ts){requestAnimationFrame(loop);const d=Math.min(ts-last,100);last=ts;pad();if(state==='PLAY'){acc+=d;while(acc>=16.667){upd();acc-=16.667;if(state!=='PLAY')break}}render()}
const start=()=>{ia();score=0;lives=3;load(0);state='PLAY';show()};
$('b-st').onclick=start;$('b-wn').onclick=start;
$('b-nx').onclick=()=>{ia();load(lv+1);state='PLAY';show()};
$('b-rt').onclick=()=>{ia();score=lvScore;lives=3;load(lv);state='PLAY';show()};
$('b-rs').onclick=pause;
load(0);requestAnimationFrame(loop);
</script></body></html>
