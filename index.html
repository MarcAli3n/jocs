<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE PLANET X GAMES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0a0517; --bg2:#150a30; --ink:#f4efff; --mute:#a99bd1;
  --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.14);
  --violet:#8b5cf6; --pink:#ff3d9a; --cyan:#2de2e6; --sun:#ffb547;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#f6f1ff;--bg2:#e4d9ff;--ink:#1a0d3a;--mute:#5b4a8a;--card:rgba(255,255,255,.65);--line:rgba(26,13,58,.18)}
}
:root[data-theme="light"]{--bg:#f6f1ff;--bg2:#e4d9ff;--ink:#1a0d3a;--mute:#5b4a8a;--card:rgba(255,255,255,.65);--line:rgba(26,13,58,.18)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:radial-gradient(1200px 700px at 75% -10%,var(--bg2),var(--bg) 70%) var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.55;min-height:100%;overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,header,footer{position:relative;z-index:1}
a{color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}

/* Hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:2rem;max-width:1180px;margin:0 auto;padding:clamp(2rem,6vw,5rem) 1.5rem 3rem;min-height:82vh}
.hero h1{font-family:var(--display);font-weight:800;line-height:.98;letter-spacing:-.02em;font-size:clamp(2.4rem,7vw,5.6rem)}
.hero h1 span{display:block}
.hero h1 .x{background:linear-gradient(100deg,var(--pink),var(--sun) 50%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:34rem;margin:1.6rem 0 2rem;color:var(--mute);font-size:1.15rem}
.btn{display:inline-block;font-family:var(--display);font-weight:500;font-size:.9rem;padding:1rem 1.6rem;border-radius:999px;text-decoration:none;color:#14062e;background:linear-gradient(100deg,var(--sun),var(--pink));box-shadow:0 10px 40px -10px var(--pink);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-3px);box-shadow:0 16px 50px -8px var(--pink)}

/* Planeta X */
.planet-wrap{position:relative;aspect-ratio:1;width:min(100%,460px);justify-self:center}
.planet{position:absolute;inset:18%;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#ffd9a0 0,#ff7a9c 22%,#8b3dff 55%,#1b0b4a 90%);
  box-shadow:inset -30px -30px 70px rgba(5,0,25,.75),0 0 90px rgba(139,92,246,.55);
  animation:float 7s ease-in-out infinite}
.planet::after{content:"X";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(4rem,12vw,8rem);color:rgba(255,255,255,.9);text-shadow:0 0 30px rgba(255,255,255,.55);mix-blend-mode:overlay}
.ring{position:absolute;inset:6% -8%;border-radius:50%;border:3px solid rgba(45,226,230,.65);transform:rotate(-18deg) scaleY(.28);box-shadow:0 0 24px rgba(45,226,230,.5)}
.ring.r2{inset:-2% -20%;border-color:rgba(255,61,154,.45);border-width:2px;box-shadow:0 0 20px rgba(255,61,154,.35)}
.moon{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:0 0 18px var(--sun);top:50%;left:50%;margin:-7px;animation:orbit 12s linear infinite}
.moon.m2{width:9px;height:9px;margin:-4.5px;background:var(--cyan);box-shadow:0 0 14px var(--cyan);animation-duration:19s;animation-direction:reverse}
@keyframes orbit{from{transform:rotate(0) translateX(min(46vw,230px)) rotate(0)}to{transform:rotate(360deg) translateX(min(46vw,230px)) rotate(-360deg)}}
@keyframes float{50%{transform:translateY(-14px)}}

/* Juegos */
.games{max-width:1180px;margin:0 auto;padding:2rem 1.5rem 5rem}
.games h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,2.6rem);letter-spacing:-.01em}
.games > p{color:var(--mute);margin:.5rem 0 2.2rem;max-width:36rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:1.4rem}
.card{--c1:var(--violet);--c2:var(--pink);position:relative;display:flex;flex-direction:column;gap:1rem;padding:1.4rem;min-height:290px;text-decoration:none;
  background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;backdrop-filter:blur(8px);
  transition:transform .25s,border-color .25s,box-shadow .25s}
.card::before{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-90px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--c2),var(--c1) 60%,transparent 72%);opacity:.9;transition:transform .5s}
.card:hover,.card:focus-visible{transform:translateY(-8px) rotate(-.6deg);border-color:var(--c2);box-shadow:0 24px 60px -24px var(--c1)}
.card:hover::before{transform:scale(1.25) translate(-10px,10px)}
.icon{position:relative;font-size:2.6rem;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.card h3{position:relative;margin-top:auto;font-family:var(--display);font-weight:500;font-size:1.3rem;line-height:1.2}
.card p{position:relative;color:var(--mute);font-size:.98rem}
.go{position:relative;font-family:var(--display);font-size:.8rem;font-weight:500;display:flex;align-items:center;gap:.6rem}
.go i{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-style:normal;transition:transform .25s}
.card:hover .go i{transform:translateX(6px)}

/* Cover y estados */
.cover{position:relative;aspect-ratio:63/50;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center;border:1px solid var(--line)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .cover img{transform:scale(1.07)}
.cover .icon{font-size:3.4rem}
.badge{position:absolute;top:.7rem;left:.7rem;z-index:2;font-family:var(--display);font-weight:500;font-size:.7rem;padding:.35rem .75rem;border-radius:999px;background:rgba(10,5,23,.78);color:var(--sun);border:1px solid var(--sun)}
.card .cover,.card h3,.card p,.card .go{position:relative}
.card h3{margin-top:0}
.card.soon{cursor:default;opacity:.85}
.card.soon .cover{background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 10px,transparent 10px 20px);border-style:dashed}
.card.soon .icon{opacity:.5;filter:grayscale(1)}
.card.soon::before{opacity:.2}
.card.soon:hover,.card.soon:focus-visible{transform:none;box-shadow:none;border-color:var(--line)}
.card.soon:hover::before{transform:none}
.card.soon .go,.card.nolink .go{color:var(--mute)}
.card.nolink{cursor:default}
.card.nolink:hover,.card.nolink:focus-visible{transform:none;box-shadow:none;border-color:var(--line)}
.card.nolink:hover::before{transform:none}
.card.nolink:hover .cover img{transform:none}

/* Destacado */
.feat{max-width:1180px;margin:0 auto;padding:0 1.5rem 3.5rem}
.feat-box{--c1:var(--violet);--c2:var(--pink);display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(1.2rem,4vw,3rem);align-items:center;padding:clamp(1rem,3vw,1.8rem);border-radius:36px;border:1px solid var(--line);
  background:radial-gradient(600px 300px at 0 0,color-mix(in srgb,var(--c1) 38%,transparent),transparent 70%),var(--card);backdrop-filter:blur(8px);box-shadow:0 30px 80px -40px var(--c1);text-decoration:none}
.feat-box .cover{aspect-ratio:63/50;border-radius:26px}
.feat-box .cover .icon{font-size:6rem}
.feat-box h2{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,4vw,3rem);line-height:1.05;letter-spacing:-.02em;margin-bottom:1rem}
.feat-box p{color:var(--mute);margin-bottom:1.6rem;max-width:30rem}
.feat-box:hover .cover img{transform:scale(1.05)}
.feat-box .btn{background:linear-gradient(100deg,var(--c1),var(--c2));color:#fff;box-shadow:0 10px 40px -10px var(--c2)}
@media (max-width:820px){.feat-box{grid-template-columns:1fr}}

footer{text-align:center;color:var(--mute);padding:2rem 1.5rem 3rem;border-top:1px solid var(--line);font-size:.95rem}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;min-height:auto;text-align:left}
  .planet-wrap{order:-1;width:min(78%,320px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<header>
  <section class="hero">
    <div>
      <h1><span>THE PLANET</span><span class="x">X GAMES</span></h1>
      <p>Bienvenido al planeta donde viven mis juegos. Elige uno, aterriza y empieza a jugar.</p>
      <a class="btn" href="#juegos">Explorar juegos</a>
    </div>
    <div class="planet-wrap" aria-hidden="true">
      <div class="ring r2"></div>
      <div class="planet"></div>
      <div class="ring"></div>
      <div class="moon"></div><div class="moon m2"></div>
    </div>
  </section>
</header>

<main>
  <section class="feat" id="destacado" hidden></section>
  <section class="games" id="juegos">
    <h2>Elige tu destino</h2>
    <p>Cada juego tiene su propia página. Pulsa una tarjeta para viajar hasta él.</p>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer>THE PLANET X GAMES &copy; <span id="y"></span>. Hecho con ganas de jugar.</footer>

const esc=t=>String(t).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function cover(j,badge){
  const listo=j.estado==="listo";
  const inner=(listo&&j.cover)?`<img src="${esc(j.cover)}" alt="Portada de ${esc(j.titulo)}" loading="lazy">`
    :`<span class="icon" aria-hidden="true">${listo?j.icono:"❔"}</span>`;
  return `<div class="cover">${badge?`<span class="badge">${badge}</span>`:""}${inner}</div>`;
}
const grid=document.getElementById("grid");
JUEGOS.forEach(j=>{
  const listo=j.estado==="listo";
  const link=listo&&j.url;
  const el=document.createElement(link?"a":"div");
  el.className="card"+(listo?(link?"":" nolink"):" soon");
  if(link)el.href=j.url;
  el.style.setProperty("--c1",j.c1);el.style.setProperty("--c2",j.c2);
  el.innerHTML=cover(j,listo?(j.destacado?"⭐ Destacado":(link?"":"Enlace pronto")):"Próximamente")+
    `<h3>${esc(j.titulo)}</h3><p>${esc(j.desc)}</p>`+
    (link?`<span class="go">Jugar ahora <i aria-hidden="true">&rsaquo;</i></span>`:`<span class="go">${listo?"Enlace muy pronto":"Muy pronto"}</span>`);
  grid.appendChild(el);
});
const d=JUEGOS.find(j=>j.destacado&&j.estado==="listo");
if(d){
  const f=document.getElementById("destacado");f.hidden=false;
  f.innerHTML=`<div class="feat-box" id="fb">${cover(d,"⭐ Juego destacado")}<div><h2>${esc(d.titulo)}</h2><p>${esc(d.desc)}</p><a class="btn" href="${esc(d.url)}">Jugar ahora</a></div></div>`;
  const fb=document.getElementById("fb");fb.style.setProperty("--c1",d.c1);fb.style.setProperty("--c2",d.c2);
}
document.getElementById("y").textContent=new Date().getFullYear();

/* Estrellas */
const cv=document.getElementById("stars"),cx=cv.getContext("2d");let S=[];
function init(){cv.width=innerWidth;cv.height=innerHeight;S=Array.from({length:Math.min(160,innerWidth/8)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.5+.3,p:Math.random()*6}))}
function draw(t){cx.clearRect(0,0,cv.width,cv.height);const dark=!matchMedia("(prefers-color-scheme: light)").matches||document.documentElement.dataset.theme==="dark";
  cx.fillStyle=dark?"#fff":"#6d4fd6";
  S.forEach(s=>{cx.globalAlpha=.35+.65*Math.abs(Math.sin(t/1400+s.p));cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.3);cx.fill()});
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches)requestAnimationFrame(draw)}
addEventListener("resize",init);init();requestAnimationFrame(draw);
</script>
